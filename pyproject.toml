[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-guard-mcp"
version = "0.1.0"
description = "A deterministic, zero-setup, sandboxed SQLite MCP server for local AI agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Atharva Siddhawar" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "sqlite",
    "ai-agents",
    "security",
    "sandbox",
    "claude-desktop",
    "llm-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Front-Ends",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/AtharvaSiddhawar/sqlite-guard-mcp"
Repository = "https://github.com/AtharvaSiddhawar/sqlite-guard-mcp"
Issues = "https://github.com/AtharvaSiddhawar/sqlite-guard-mcp/issues"

[project.scripts]
sqlite-guard-mcp = "sqlite_guard_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
