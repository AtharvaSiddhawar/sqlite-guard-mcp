[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sqlite-guard-mcp"
version = "0.2.4"
description = "A read-only, security-hardened SQLite MCP server for local AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Atharva Siddhawar" }]
keywords = ["mcp", "model-context-protocol", "sqlite", "read-only", "security", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Security",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.0",
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
sqlite-guard-mcp = "sqlite_guard_mcp.server:main"

[project.urls]
Homepage = "https://github.com/AtharvaSiddhawar/sqlite-guard-mcp"
Repository = "https://github.com/AtharvaSiddhawar/sqlite-guard-mcp"
Issues = "https://github.com/AtharvaSiddhawar/sqlite-guard-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_guard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Standard test options and coverage targeting the source directory
addopts = "-ra --cov=src/sqlite_guard_mcp --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["src/sqlite_guard_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/SKILL.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
  "/.github",
]
