[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "sqlite-guard-mcp"
version = "0.1.0"
description = "A sandboxed, read-only MCP server for exploring a local SQLite database."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.scripts]
sqlite-guard-mcp = "sqlite_guard_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_guard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
