name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m pytest -v --tb=short --cov=sqlite_guard_mcp --cov-report=term-missing --cov-fail-under=90 -W error::ResourceWarning > pytest_output.log 2>&1
          STATUS=$?
          cat pytest_output.log
          if [ $STATUS -ne 0 ]; then
            FAIL_LINE=$(grep -E "^(FAILED|ERROR) " pytest_output.log | tr '\n' ' ' | cut -c 1-200)
            echo "::error title=Pytest Failures::$FAIL_LINE"
            exit $STATUS
          fi
          set -e

      - name: Build distributions and validate
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
