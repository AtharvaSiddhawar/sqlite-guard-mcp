name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m pytest -v --tb=short > pytest_output.log 2>&1
          STATUS=$?
          cat pytest_output.log
          if [ $STATUS -ne 0 ]; then
            FAIL_LINE=$(grep -E "^(FAILED|ERROR) " pytest_output.log | tr '\n' ' ' | cut -c 1-200)
            echo "::error title=Pytest Failures::$FAIL_LINE"
            exit $STATUS
          fi
          set -e

      - name: Build distributions
        run: python -m build
