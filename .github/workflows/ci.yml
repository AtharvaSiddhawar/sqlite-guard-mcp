name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Clean legacy starter modules and sync package init
        run: |
          rm -f src/sqlite_guard_mcp/cli.py src/sqlite_guard_mcp/guard.py tests/test_sqlite_guard.py
          printf '"""sqlite-guard-mcp package."""\nfrom .server import SQLiteGuardMCPServer, SQLiteGuardServer, __version__, main\n\n__all__ = ["SQLiteGuardMCPServer", "SQLiteGuardServer", "__version__", "main"]\n' > src/sqlite_guard_mcp/__init__.py
          if [ "${{ matrix.python-version }}" = "3.12" ] && [ -n "$(git status --porcelain)" ]; then
            git config user.name "AtharvaSiddhawar"
            git config user.email "AtharvaSiddhawar@users.noreply.github.com"
            git add -A
            git commit -m "chore: remove legacy modules and sync package init"
            git push origin HEAD:main || true
          fi
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Ruff linter
        run: ruff check src tests
      - name: Run Pytest suite
        run: pytest -v
        
